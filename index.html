<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">

</head>
<body>

    <h1>Tic Tac Toe</h1>


        <div id ="players">
            <p id ="player1-name"></p>
            <p>vs</p>
            <p id = "player2-name"></p>
        </div>
        <div class="player-turn"><span class="player-number"></span>'s turn</div>

    <div class="grid">
        <div  class="box1"></div>
        <div  class="box2"></div>
        <div  class="box3"></div>
        <div  class="box4"></div>
        <div  class="box5"></div>
        <div  class="box6"></div>
        <div  class="box7"></div>
        <div  class="box8"></div>
        <div  class="box9"></div>
    </div>

    <button class="start-game">Start Game</button>

    <div class="overlay">
    <div class="take-player-names-modal">
            <div>
                <form action="">
                    <label for="player1">Enter name for player 1 </label>
                    <input required type="text" name="player1" id="player1">
                    <label for="player2">Enter name for player 2</label>
                    <input required type="text" name="player2" id="player2">

                </form>
                 <div class="buttons">
                        <div><button type="submit" id="submit-player-names">Submit</button></div>
                        <div><button id="skip">skip</button></div>
                    </div>

            </div>
        </div>
        </div>

        <dialog class="show-winner">
            <p></p>
            <button id="new-game">New Game</button>
        </dialog>

    <script defer src="./main.js"></script>
</body>
</html>
